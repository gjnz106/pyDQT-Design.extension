title: "Property\nLine"
author: Dang Quoc Truong (DQT)
name: PropertyLineFromExcel
tooltip: >
  Draw a closed Model Line boundary from Easting/Northing points in an
  Excel file - no manual point-by-point entry.

  Workflow:
  - Pick an .xlsx file. The tool scans every sheet for coordinate tables
    (a header row with Easting/X and Northing/Y columns, a Point/Name
    column to their left, and a title row above - like a typical
    "Indicative Coordinates" schedule). If one header is shared by
    several boundaries listed back-to-back with no row between them
    (e.g. WL1..WL8 immediately followed by LB1..LB30), it is split into
    one boundary per label prefix rather than looped through as one -
    only works when point labels end in a letters+number pattern
  - Tick which table(s) to draw - one closed Model Line loop per table,
    so several boundaries from one file (e.g. working limit + jetty
    limits) can be drawn in one go
  - Choose whether the X/Y values are Shared/Survey coordinates (e.g.
    SVY21 easting/northing) or already Internal/Project coordinates, the
    input unit, and which Level to flatten the boundary onto
  - In Shared mode the conversion is measured from the model through
    Revit's own Report Shared Coordinates, so it follows whatever the
    project acquired or published, rotation included. Before drawing,
    the dialog converts the first point and asks Revit to report it
    back - if it does not match the spreadsheet, it says so

  Note: Revit's own Property Line object cannot be created through its
  public API on any supported version, so this draws Model Lines, not a
  true Property Line. Use the Model Lines as a reference and Revit's own
  Property Lines > Edit Table dialog to enter the final Property Line.

  Only .xlsx is supported (read directly, no Excel installation needed).

